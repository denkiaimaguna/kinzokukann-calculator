<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2640;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3a5c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e85c2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5854d;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- 装飾ライン（右上） -->
  <circle cx="1100" cy="-80" r="300" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="60"/>
  <circle cx="1100" cy="-80" r="200" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="40"/>

  <!-- 装飾ライン（左下） -->
  <circle cx="100" cy="710" r="250" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="50"/>

  <!-- アクセントバー -->
  <rect x="80" y="260" width="6" height="110" rx="3" fill="url(#accent)" />

  <!-- ⚡アイコン背景 -->
  <rect x="80" y="80" width="80" height="80" rx="16" fill="#e85c2a" fill-opacity="0.15"/>
  <!-- ⚡テキスト -->
  <text x="120" y="136" font-family="Arial, sans-serif" font-size="44" text-anchor="middle" fill="#e85c2a">⚡</text>

  <!-- メインタイトル -->
  <text x="96" y="310" font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', Arial, sans-serif"
        font-size="62" font-weight="700" fill="#ffffff" letter-spacing="2">
    金属管工事
  </text>
  <text x="96" y="380" font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', Arial, sans-serif"
        font-size="62" font-weight="700" fill="#ffffff" letter-spacing="2">
    材料計算ツール
  </text>

  <!-- サブタイトル -->
  <text x="96" y="446" font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', Arial, sans-serif"
        font-size="28" fill="#94b8d4" letter-spacing="1">
    本数・カップリング・支持材・末端処理を自動計算
  </text>

  <!-- タグ：E管/G管 -->
  <rect x="96" y="498" width="120" height="42" rx="8" fill="#e85c2a" fill-opacity="0.2"/>
  <text x="156" y="525" font-family="Arial, sans-serif" font-size="20" font-weight="700"
        text-anchor="middle" fill="#e85c2a">E管 / G管</text>

  <rect x="232" y="498" width="110" height="42" rx="8" fill="#e85c2a" fill-opacity="0.2"/>
  <text x="287" y="525" font-family="Arial, sans-serif" font-size="20" font-weight="700"
        text-anchor="middle" fill="#e85c2a">屋内・屋外</text>

  <rect x="358" y="498" width="120" height="42" rx="8" fill="#e85c2a" fill-opacity="0.2"/>
  <text x="418" y="525" font-family="Arial, sans-serif" font-size="20" font-weight="700"
        text-anchor="middle" fill="#e85c2a">無料・無登録</text>

  <!-- 右側：配管イメージ（簡易図） -->
  <!-- 管のライン -->
  <line x1="820" y1="200" x2="1100" y2="200" stroke="#94b8d4" stroke-width="12" stroke-linecap="round" stroke-opacity="0.5"/>
  <line x1="1100" y1="200" x2="1100" y2="430" stroke="#94b8d4" stroke-width="12" stroke-linecap="round" stroke-opacity="0.5"/>
  <line x1="820" y1="430" x2="1100" y2="430" stroke="#94b8d4" stroke-width="12" stroke-linecap="round" stroke-opacity="0.5"/>

  <!-- カップリング -->
  <rect x="930" y="188" width="30" height="24" rx="4" fill="#e85c2a" fill-opacity="0.8"/>
  <rect x="1088" y="295" width="24" height="30" rx="4" fill="#e85c2a" fill-opacity="0.8"/>
  <rect x="880" y="418" width="30" height="24" rx="4" fill="#e85c2a" fill-opacity="0.8"/>

  <!-- ボックス（始端・終端） -->
  <rect x="790" y="176" width="36" height="48" rx="6" fill="#1a3a5c" stroke="#94b8d4" stroke-width="3" stroke-opacity="0.6"/>
  <rect x="790" y="406" width="36" height="48" rx="6" fill="#1a3a5c" stroke="#94b8d4" stroke-width="3" stroke-opacity="0.6"/>

  <!-- サドル -->
  <rect x="860" y="188" width="16" height="28" rx="3" fill="none" stroke="#94b8d4" stroke-width="2.5" stroke-opacity="0.5"/>
  <rect x="1000" y="188" width="16" height="28" rx="3" fill="none" stroke="#94b8d4" stroke-width="2.5" stroke-opacity="0.5"/>
  <rect x="1090" y="250" width="28" height="16" rx="3" fill="none" stroke="#94b8d4" stroke-width="2.5" stroke-opacity="0.5"/>

  <!-- ボトム：作者タグ -->
  <text x="80" y="600" font-family="Arial, sans-serif" font-size="20" fill="#4a6a8a">
    電気工事士 × AI  |  現場で使えるDXツール
  </text>
</svg>
